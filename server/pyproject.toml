[project]
name = "mcp-snegopat"
version = "1.19.0"
description = "MCP-сервер живого конфигуратора 1С через Снегопат (проект mcp-configurator)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "lxml", "pillow", "pywin32; sys_platform == 'win32'"]
license = { text = "proprietary" }

# №18 (прогон v1.15): UI-контур (uia_tree/uia_menu_map) на Windows —
# `pip install -e "server[win-ui]"`; install.ps1 ставит то же самое
[project.optional-dependencies]
# №24 (прогон v1.17): uiaautomation не совместим с Python 3.14+ — верхняя
# граница на extra (uv на 3.15 «No solution found»); вне диапазона
# UI-контур не ставится, остальной сервер работает
win-ui = ["uiaautomation>=2.0.29; sys_platform == 'win32' and python_version < '3.14'"]

[project.scripts]
mcp-snegopat = "mcp_snegopat.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_snegopat"]
