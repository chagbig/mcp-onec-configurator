[project]
name = "mcp-snegopat"
version = "1.13.0"
description = "MCP-сервер живого конфигуратора 1С через Снегопат (проект mcp-configurator)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "lxml", "pillow", "pywin32; sys_platform == 'win32'"]
license = { text = "proprietary" }

[project.scripts]
mcp-snegopat = "mcp_snegopat.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_snegopat"]
